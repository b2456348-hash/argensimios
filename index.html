<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARGENSIMIOS</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1e3a;--bg2:#12325f;--card:#ffffff14;--txt:#fff;--celeste:#74c3f0;--sol:#f6b40e;--si:#2ecc71;--no:#ff5a5f;--font:'Poppins',system-ui,sans-serif;--disp:'Bungee','Arial Black',Impact,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#dff2fd;--bg2:#b9e2f8;--card:#ffffffcc;--txt:#0b1e3a}}
:root[data-theme="light"]{--bg:#dff2fd;--bg2:#b9e2f8;--card:#ffffffcc;--txt:#0b1e3a}
:root[data-theme="dark"]{--bg:#0b1e3a;--bg2:#12325f;--card:#ffffff14;--txt:#fff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg));color:var(--txt);font-family:var(--font);overflow-x:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;overflow-y:auto;padding:20px 16px}
.screen.on{display:flex;animation:fade .5s}
@keyframes fade{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
/* INTRO */
#intro{justify-content:center;text-align:center;overflow:hidden;cursor:pointer}
.sun{position:absolute;width:140vmax;height:140vmax;left:50%;top:50%;margin:-70vmax;background:repeating-conic-gradient(from 0deg,#f6b40e22 0 6deg,transparent 6deg 12deg);animation:spin 60s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.stripe{position:absolute;left:0;right:0;height:22vh;background:var(--celeste);opacity:.18}
.stripe.a{top:0}.stripe.b{bottom:0}
h1.logo{font-family:var(--disp);font-size:clamp(34px,10.5vw,96px);display:flex;flex-wrap:wrap;justify-content:center;position:relative;line-height:1.05}
.logo span{display:inline-block;opacity:0;transform:translateY(-120px) rotate(-20deg) scale(.4);animation:drop .7s cubic-bezier(.3,1.6,.5,1) forwards;color:var(--celeste);text-shadow:0 4px 0 #0b1e3a55,0 0 30px #74c3f088}
.logo span:nth-child(3n){color:#fff}.logo span:nth-child(5n){color:var(--sol)}
@keyframes drop{to{opacity:1;transform:none}}
.tag{position:relative;margin-top:14px;opacity:0;animation:fade .8s 1.6s forwards;letter-spacing:.3em;font-size:12px;text-transform:uppercase;color:var(--sol);font-weight:700}
.start{position:relative;margin-top:36px;opacity:0;animation:fade .8s 2.1s forwards,pulse 1.4s 2.9s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.btn{font-family:var(--disp);font-size:18px;padding:14px 32px;border:0;border-radius:999px;background:linear-gradient(180deg,var(--sol),#e39a00);color:#3a2800;cursor:pointer;box-shadow:0 6px 0 #a56f00,0 10px 24px #0005;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a56f00}
.btn.sec{background:var(--card);color:var(--txt);box-shadow:0 4px 0 #0003;font-size:14px;padding:10px 20px}
.emo{position:absolute;font-size:32px;opacity:.5;animation:float 6s ease-in-out infinite;pointer-events:none}
@keyframes float{50%{transform:translateY(-24px) rotate(12deg)}}
/* GAME */
#game{gap:14px}
.top{width:100%;max-width:820px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mini{font-family:var(--disp);font-size:20px;color:var(--celeste)}
.pill{background:var(--card);padding:6px 14px;border-radius:99px;font-weight:700;font-size:14px}
.mystery{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:56px;background:radial-gradient(circle,var(--sol),#c98500);box-shadow:0 0 0 6px #f6b40e44,0 0 40px #f6b40e66;animation:bob 3s ease-in-out infinite;font-family:var(--disp);color:#3a2800}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.mystery.think{animation:shake .4s infinite}
@keyframes shake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.answer{height:64px;font-family:var(--disp);font-size:44px;display:flex;align-items:center}
.answer.si{color:var(--si)}.answer.no{color:var(--no)}
.answer.pop{animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{from{transform:scale(0) rotate(-15deg)}to{transform:none}}
.qs{width:100%;max-width:820px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.q{background:var(--card);color:var(--txt);border:2px solid transparent;border-radius:14px;padding:12px 14px;text-align:left;font:600 14px var(--font);cursor:pointer;transition:.15s}
.q:hover{border-color:var(--celeste);transform:translateY(-2px)}
.q.done{opacity:.55;cursor:default;transform:none;border-color:transparent}
.q.done.si{border-left:6px solid var(--si)}.q.done.no{border-left:6px solid var(--no)}
h3{width:100%;max-width:820px;font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--celeste)}
.grid{width:100%;max-width:820px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.p{background:var(--card);border-radius:16px;padding:10px 4px;text-align:center;cursor:pointer;border:2px solid transparent;transition:.2s;font-size:12px;font-weight:600}
.p b{display:block;font-size:34px;margin-bottom:2px}
.p.out{opacity:.25;filter:grayscale(1);transform:scale(.92)}
.guessing .p:not(.out):hover{border-color:var(--sol);transform:scale(1.06)}
.guessing .p:not(.out){animation:wig .5s infinite alternate}
@keyframes wig{to{transform:rotate(2deg)}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* MODAL */
#modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:9;padding:20px}
#modal.on{display:grid}
.box{background:var(--bg2);border-radius:24px;padding:28px;text-align:center;max-width:360px;width:100%;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.box .big{font-size:80px}.box h2{font-family:var(--disp);margin:8px 0;color:var(--sol)}.box p{margin-bottom:18px}
.conf{position:fixed;top:-30px;font-size:26px;animation:fall linear forwards;z-index:10;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

#game{padding-bottom:0}
.log{width:100%;max-width:820px;flex:1;min-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.hint{text-align:center;opacity:.75;font-size:13px}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;font-weight:600;font-size:14px;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.msg.q{align-self:flex-end;background:var(--celeste);color:#0b1e3a;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--card);border-bottom-left-radius:4px;font-family:var(--disp)}
.msg.a.si{color:var(--si)}.msg.a.no{color:var(--no)}.msg.a.ns{color:var(--sol)}
.bar{width:100%;max-width:820px;display:flex;gap:8px;padding:8px 0 14px;position:sticky;bottom:0}
.bar input{flex:1;min-width:0;padding:14px 18px;border-radius:99px;border:2px solid var(--celeste);background:var(--card);color:var(--txt);font:600 15px var(--font);outline:0}
.bar .btn{padding:10px 20px}
</style>
</head>
<body>

<section id="intro" class="screen on">
  <div class="sun"></div><div class="stripe a"></div><div class="stripe b"></div>
  <h1 class="logo" id="logo"></h1>
  <div class="tag">¿Quién es el del grupo?</div>
  <button class="btn start">JUGAR</button>
</section>

<section id="menu" class="screen" style="justify-content:center;text-align:center;gap:18px">
  <div class="mystery">?</div>
  <h2 class="mini" style="font-size:28px">Pensé en alguien del grupo</h2>
  <p style="max-width:340px;opacity:.85">Tenés <b id="maxq"></b> preguntas. Yo contesto <b style="color:var(--si)">SÍ</b> o <b style="color:var(--no)">NO</b>. Para ganar, escribí el nombre de la persona.</p>
  <button class="btn" id="go">EMPEZAR</button>
</section>

<section id="game" class="screen">
  <div class="top"><span class="mini">ARGENSIMIOS</span><span class="pill">Preguntas: <span id="cnt">0</span>/<span id="max"></span></span></div>
  <div class="mystery" id="myst">?</div>
  <div class="answer" id="ans"></div>
  <div class="log" id="log"><div class="hint">Preguntame lo que quieras (sí/no). Cuando sepas quién es, escribí solo el <b>nombre</b>.</div></div>
  <div class="bar"><input id="inp" placeholder="Escribí tu pregunta o un nombre..." autocomplete="off" maxlength="140"><button class="btn" id="send">➤</button><button class="btn sec" id="theme">☀️/🌙</button></div>
</section>

<div id="modal"><div class="box"><div class="big" id="mEmo"></div><h2 id="mTit"></h2><p id="mTxt"></p><button class="btn" id="again">OTRA VEZ</button></div></div>

<script>
/* ============ DATOS (editá acá) ============ */
const MAX_PREGUNTAS = 15;
// n: nombre | alias: otras formas de escribirlo | e: emoji | d: datos que usa la IA para responder
const PERSONAS = [
  {n:'Benja',alias:[],e:'😂',d:'Es conocido por ser muy chistoso. Es menor de edad. Integrante del grupo.'},
  {n:'Expe',alias:[],e:'🐦',d:'Es el creador del grupo de WhatsApp y un gran tuitero.'}
];
/* ============================================ */
const $=id=>document.getElementById(id);
const norm=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿?¡!.,]/g,'').trim();
let secret,hist,over,busy;

[...'ARGENSIMIOS'].forEach((c,i)=>{const s=document.createElement('span');s.textContent=c;s.style.animationDelay=(i*.09)+'s';$('logo').appendChild(s)});
['🧉','⚽','🇦🇷','🥩','☀️','🎸'].forEach((e,i)=>{const d=document.createElement('div');d.className='emo';d.textContent=e;d.style.left=(8+i*17)+'%';d.style.top=(12+(i%3)*32)+'%';d.style.animationDelay=(i*.7)+'s';$('intro').appendChild(d)});

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on')}
$('intro').onclick=()=>show('menu');
$('maxq').textContent=$('max').textContent=MAX_PREGUNTAS;
$('go').onclick=start;
$('again').onclick=()=>{$('modal').classList.remove('on');show('menu')};
$('theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};
$('send').onclick=submit;
$('inp').onkeydown=e=>{if(e.key==='Enter')submit()};

function start(){
  secret=PERSONAS[Math.floor(Math.random()*PERSONAS.length)];
  hist=[];over=false;busy=false;
  $('cnt').textContent=0;$('ans').textContent='';$('myst').textContent='?';$('inp').value='';
  $('log').innerHTML='<div class="hint">Preguntame lo que quieras (sí/no). Cuando sepas quién es, escribí solo el <b>nombre</b>.</div>';
  show('game');setTimeout(()=>$('inp').focus(),300);
}
function add(cls,txt){const d=document.createElement('div');d.className='msg '+cls;d.textContent=txt;$('log').appendChild(d);$('log').scrollTop=1e6;return d}
function findGuess(t){
  let x=norm(t).replace(/^(sera|es|es el|es la|sera el|sera la)\s+/,'');
  return PERSONAS.find(p=>[p.n,...p.alias].some(n=>norm(n)===x));
}
async function submit(){
  const t=$('inp').value.trim();
  if(!t||over||busy)return;
  $('inp').value='';
  add('q',t);
  const g=findGuess(t);
  if(g)return end(g===secret);
  if(hist.length>=MAX_PREGUNTAS){add('a ns','Se acabaron las preguntas. ¡Escribí un nombre!');return}
  busy=true;$('myst').classList.add('think');$('ans').className='answer';$('ans').textContent='';
  let r='ns';
  try{
    const past=hist.map(h=>'P: '+h.q+' -> '+h.r.toUpperCase()).join('\n')||'(ninguna)';
    const res=await fetch('/.netlify/functions/juez',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:secret.n,d:secret.d,past,q:t})});
    if(!res.ok)throw 0;
    const j=await res.json();
    const u=norm(j.r||'').toUpperCase();
    r=u.startsWith('NOSE')?'ns':u.startsWith('SI')?'si':u.startsWith('NO')?'no':'ns';
  }catch(e){add('a ns','No pude conectarme con el juez 😵');busy=false;$('myst').classList.remove('think');return}
  hist.push({q:t,r});
  $('cnt').textContent=hist.length;
  $('myst').classList.remove('think');
  const lab={si:'¡SÍ!',no:'NO',ns:'🤷 NI IDEA'}[r];
  const an=$('ans');an.textContent=lab;an.className='answer pop '+r;
  add('a '+r,lab);
  busy=false;
  if(hist.length>=MAX_PREGUNTAS)add('a ns','Última pregunta usada. ¡Escribí un nombre!');
}
function end(win){
  over=true;$('myst').textContent=secret.e;
  $('mEmo').textContent=win?'🏆':'😵';
  $('mTit').textContent=win?'¡LO ADIVINASTE!':'¡ERRASTE!';
  $('mTxt').textContent=win?'Era '+secret.n+'. Sos un crack.':'Era '+secret.n+'. Suerte para la próxima.';
  setTimeout(()=>{$('modal').classList.add('on');if(win)confetti()},700);
}
function confetti(){
  for(let i=0;i<40;i++){const c=document.createElement('div');c.className='conf';c.textContent=['🎉','⭐','🇦🇷','🧉'][i%4];c.style.left=Math.random()*100+'vw';c.style.animationDuration=(2+Math.random()*2)+'s';c.style.animationDelay=Math.random()+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),5000)}
}
</script>
</body>
</html>
